<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
      body {
        background: url('/media/bj/bj2.jpg') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        /* 可选：加一点模糊 */
        /* filter: blur(2px); */
      }
      /* .main-bg-mask, .container.main-bg-mask {
        background: rgba(255,255,255,0.85);
        border-radius: 18px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.04);
        padding-top: 16px;
        padding-bottom: 16px;
      } */
      @media (max-width: 768px) {
        .main-bg-mask, .container.main-bg-mask { border-radius: 0; }
      }
      .main-content-fixed {
        padding-top: 70px;
      }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-0 fixed-top">
  <div class="container">
    <a class="navbar-brand" href="/">校园二手交易</a>
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">首页</a></li>
      <li class="nav-item"><a class="nav-link {% if '/users/announcement' in request.path %}active{% endif %}" href="{% url 'users:announcement_list' %}">系统公告</a></li>
      <li class="nav-item"><a class="nav-link {% if '/users/products/create' in request.path %}active{% endif %}" href="{% url 'users:product_create' %}">发布闲置</a></li>
    </ul>
    <ul class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            {% if user.profile.avatar %}
              <img src="{{ user.profile.avatar.url }}" alt="头像" style="width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px;">
            {% else %}
              <span class="bi bi-person-circle" style="font-size:1.5rem;margin-right:8px;"></span>
            {% endif %}
            {{ user.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="{% url 'users:profile' %}">个人中心</a></li>
            <li><a class="dropdown-item" href="{% url 'users:my_orders' %}">我的订单</a></li>
            <li><a class="dropdown-item" href="{% url 'users:cart' %}">我的购物车</a></li>
            <li><a class="dropdown-item" href="{% url 'users:my_products' %}">我的商品</a></li>
            <li><a class="dropdown-item" href="{% url 'users:logout' %}">退出登录</a></li>
          </ul>
        </li>
      {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'users:register' %}">注册</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'users:login' %}">登录</a></li>
      {% endif %}
    </ul>
  </div>
</nav>
<!-- 全局 Toast 提示 -->
<div id="global-toast" class="toast align-items-center text-white border-0 position-fixed top-50 start-50 translate-middle" role="alert" aria-live="assertive" aria-atomic="true" style="z-index: 9999; min-width: 220px; display: none;">
  <div class="d-flex">
    <div class="toast-body w-100 text-center"></div>
  </div>
</div>
<div class="container main-content-fixed">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // 获取 Django 消息
  {% if messages %}
    {% for message in messages %}
      showGlobalToast("{{ message|escapejs }}", "{{ message.tags }}");
    {% endfor %}
  {% endif %}

  function showGlobalToast(msg, level) {
    var toast = document.getElementById('global-toast');
    var body = toast.querySelector('.toast-body');
    body.textContent = msg;
    toast.className = 'toast align-items-center text-white border-0 position-fixed top-50 start-50 translate-middle show';
    toast.style.display = 'block';
    // 颜色
    if (level.includes('success')) {
      toast.style.backgroundColor = '#28a745';
    } else if (level.includes('error') || level.includes('danger')) {
      toast.style.backgroundColor = '#dc3545';
    } else if (level.includes('warning')) {
      toast.style.backgroundColor = '#ffc107';
      toast.style.color = '#333';
    } else {
      toast.style.backgroundColor = '#007bff';
    }
    setTimeout(function() {
      toast.classList.remove('show');
      toast.style.display = 'none';
    }, 1000);
  }
});
</script>
</body>
</html>
