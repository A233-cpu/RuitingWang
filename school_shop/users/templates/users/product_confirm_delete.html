{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="alert alert-danger">
    <h4>确认删除</h4>
    <p>你确定要删除商品 <strong>{{ product.name }}</strong> 吗？此操作不可恢复。</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">确认删除</button>
      <a href="{% url 'users:my_products' %}" class="btn btn-secondary ms-2">取消</a>
    </form>
  </div>
</div>
{% endblock %}
